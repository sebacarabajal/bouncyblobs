<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- celular: agregándolo a la pantalla de inicio se abre a pantalla completa, como una app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bouncy Blobs" />
    <meta name="theme-color" content="#170828" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>Bouncy Blobs</title>
    <!-- fuentes servidas por el juego (public/fonts), pedidas apenas se lee la página: antes venían de Google en dos
         viajes y el menú se dibujaba primero con otra letra y después cambiaba -->
    <link rel="preload" href="/fonts/lilita-one-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Lilita One'; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/lilita-one-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Lilita One'; font-style: normal; font-weight: 400; font-display: block; src: url(/fonts/lilita-one-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 700 900; font-display: swap; src: url(/fonts/nunito-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 700 900; font-display: swap; src: url(/fonts/nunito-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1b0c35; font-family: 'Trebuchet MS', system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      #app canvas { touch-action: none; }
      #app canvas { display: block; }
      /* ---------- HUD: estilo "calcomanía" (bordes gruesos, sombras sólidas, letra gorda) ---------- */
      :root { --ink: #12051f; --panel: #24103f; --panel2: #321a58; --cream: #fff1dc; --gold: #ffd21a; --silver: #d7d2e6; --bronze: #e08a4a; }
      .disp { font-family: 'Lilita One', 'Trebuchet MS', system-ui, sans-serif; font-weight: 400; letter-spacing: 0.5px; }
      #help {
        position: fixed; top: 14px; left: 14px; padding: 10px 14px 12px; border-radius: 16px; max-width: 360px;
        background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); font-size: 12.5px; line-height: 1.65; color: #e9defa;
      }
      #help b { display: block; font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; font-size: 19px; margin-bottom: 4px; letter-spacing: 1px; color: var(--cream); }
      #help kbd { display: inline-block; min-width: 18px; text-align: center; background: var(--cream); color: var(--ink); border-radius: 5px; padding: 0 5px; font: 800 11px/1.5 'Nunito', system-ui, sans-serif; box-shadow: 0 2px 0 var(--ink); border: 1.5px solid var(--ink); }
      #perf { position: fixed; right: 12px; bottom: 10px; z-index: 6; font: 11px/1.45 ui-monospace, monospace; color: #e8dcff; background: rgba(15, 6, 30, 0.6); padding: 5px 9px; border-radius: 8px; pointer-events: none; text-align: right; }
      #perf span { color: #bba9dd; }
      body.in-lobby #perf { display: none; }
      #mode { margin-top: 6px; display: inline-block; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.12); }
      #mode.hot { background: #ff4f6d; }
      .white { color: #fff; font-weight: bold; text-shadow: 0 0 8px #fff; }

      /* tu gelatina (abajo a la izquierda) */
      #me {
        --c: #fff; position: fixed; left: 16px; top: 30px; width: 340px; padding: 26px 14px 12px; border-radius: 22px;
        background: linear-gradient(color-mix(in srgb, var(--c) 18%, var(--panel)), var(--panel) 60%); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink);
        font-family: 'Nunito', system-ui, sans-serif;
      }
      #me .me-tag { position: absolute; left: 12px; top: -20px; padding: 3px 16px 5px; border-radius: 14px; background: var(--c); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transform: rotate(-3deg); max-width: 210px; }
      #me .me-tag .nm { display: block; font-family: 'Lilita One', system-ui, sans-serif; font-size: 24px; line-height: 1; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 2px; }
      /* gotas que cuelgan del cartel del nombre */
      #me .me-tag::after { content: ''; position: absolute; left: 22px; bottom: -11px; width: 34px; height: 12px;
        background: radial-gradient(circle at 6px 3px, var(--c) 5px, transparent 5.5px), radial-gradient(circle at 24px 1px, var(--c) 7px, transparent 7.5px); }
      #me .me-pts { position: absolute; right: 12px; top: -16px; min-width: 92px; padding: 2px 10px 3px; text-align: center; border-radius: 12px; background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transform: rotate(2deg); color: var(--ink); line-height: 1; }
      #me .me-pts b { font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; font-size: 24px; }
      #me .me-pts small { font-weight: 900; font-size: 11px; margin-left: 3px; }
      #me .me-stats { display: flex; gap: 14px; margin: 2px 2px 6px; font-size: 12px; font-weight: 800; color: #cbb9ea; text-transform: uppercase; letter-spacing: 0.5px; }
      #me .me-stats b { font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; font-size: 17px; color: var(--cream); margin-right: 3px; }
      #me .gauge { display: grid; grid-template-columns: 1fr 46px; grid-template-rows: auto auto; column-gap: 8px; margin-top: 4px; }
      #me .gauge .lbl { grid-column: 1; font-weight: 900; font-size: 10.5px; letter-spacing: 1.2px; color: #cbb9ea; margin: 0 0 1px 6px; }
      #me .gauge .v { grid-column: 2; grid-row: 1 / 3; align-self: end; text-align: right; font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; font-size: 21px; line-height: 1.05; color: var(--cream); }
      /* tubo de vidrio con gelatina adentro */
      .tube { position: relative; height: 20px; border-radius: 99px; background: #170a2b; border: 3px solid var(--ink); overflow: hidden; box-shadow: inset 0 3px 0 rgba(0,0,0,0.35); }
      .tube > i { position: absolute; inset: 0; border-radius: 99px; background: var(--f, #fff); transform: translateX(-100%); transition: transform 0.18s ease-out, background-color 0.3s; will-change: transform; }
      .tube > i::before { content: ''; position: absolute; right: -5px; top: -3px; bottom: -3px; width: 14px; border-radius: 50%; background: inherit; animation: meniscus 0.9s ease-in-out infinite alternate; }
      .tube > i::after { content: ''; position: absolute; left: 8px; right: 10px; top: 3px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.45); }
      .tube::after { content: ''; position: absolute; inset: 0; border-radius: 99px; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); pointer-events: none; }
      @keyframes meniscus { from { transform: scaleX(0.75); } to { transform: scaleX(1.15); } }
      #me .gauge.mass .tube > i { --f: #f4eefe; }
      #me.sprint .gauge.cd .tube > i { --f: #ff9d2e; }
      #me .gauge.cd .tube > i { --f: #c6f03a; }
      #me .gauge.cd .cost { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--ink); z-index: 1; }
      #me.ready .gauge.cd .tube { border-color: var(--ink); box-shadow: inset 0 3px 0 rgba(0,0,0,0.35), 0 0 0 2px #c6f03a; }
      #me.ready .cdv { color: #c6f03a; }
      #me .me-bottom { display: flex; align-items: center; gap: 8px; margin-top: 10px; min-height: 52px; }
      /* armas: teclas de verdad (D / F) */
      #me .weapon { display: flex; gap: 8px; }
      #me .key { position: relative; width: 50px; height: 48px; border-radius: 11px; background: #3a2260; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; opacity: 0.45; filter: grayscale(0.8); }
      #me .key.on { opacity: 1; filter: none; background: var(--cream); }
      #me .key kbd { position: absolute; left: 5px; top: 2px; font: 900 11px/1 'Nunito', system-ui, sans-serif; color: #8d7bb0; }
      #me .key.on kbd { color: var(--ink); }
      #me .key i { font-style: normal; font-size: 22px; line-height: 1; margin-top: 4px; }
      #me .key b { position: absolute; right: -8px; bottom: -8px; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 11px; background: #ff4f6d; border: 2.5px solid var(--ink); color: #fff; font: 400 13px/17px 'Lilita One', system-ui, sans-serif; text-align: center; }
      #me .key:not(.on) b { display: none; }
      /* poderes activos: anillo que se va vaciando */
      #me .buffs { display: flex; gap: 8px; margin-left: auto; }
      #me .buff { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
        background: conic-gradient(var(--gold) calc(var(--p) * 360deg), #3a2260 0); }
      #me .buff::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel2); }
      #me .buff i { position: relative; font-style: normal; font-size: 19px; line-height: 1; }
      #me .buff b { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); font: 400 12px/1 'Lilita One', system-ui, sans-serif; color: var(--cream); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
      #me .buff.slip { background: #8a6a3a; }
      @keyframes pulse { from { transform: translate(-50%, -50%) rotate(-4deg) scale(1); } to { transform: translate(-50%, -50%) rotate(-2deg) scale(1.07); } }

      /* tabla de posiciones (derecha) */
      #rivals { position: fixed; right: 16px; top: 76px; width: 300px; padding: 22px 8px 8px; border-radius: 20px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font-family: 'Nunito', system-ui, sans-serif; font-size: 13px; }
      .rank-title { position: absolute; left: 50%; top: -18px; transform: translateX(-50%) rotate(-2deg); padding: 3px 18px 4px; border-radius: 12px; background: var(--gold); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font-family: 'Lilita One', system-ui, sans-serif; font-size: 19px; letter-spacing: 1.5px; color: var(--ink); white-space: nowrap; }
      .rival { --c: #fff; position: relative; display: grid; grid-template-columns: 24px 26px 1fr auto 44px; grid-template-rows: auto 4px; column-gap: 6px; align-items: center; padding: 3px 8px 4px 4px; border-radius: 12px; margin-top: 1px; }
      .rival:nth-child(odd) { background: rgba(255,255,255,0.035); }
      .rival .pos { grid-row: 1 / 3; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 400 13px/1 'Lilita One', system-ui, sans-serif; color: #9f8cc4; }
      .rival.p1 .pos, .rival.p2 .pos, .rival.p3 .pos { color: var(--ink); border: 2px solid var(--ink); }
      .rival.p1 .pos { background: var(--gold); } .rival.p2 .pos { background: var(--silver); } .rival.p3 .pos { background: var(--bronze); }
      /* la gelatinita del color de cada uno; el tamaño muestra su masa */
      .rival .blob { grid-row: 1 / 3; justify-self: center; width: 18px; height: 17px; border-radius: 50% 50% 44% 44% / 60% 60% 40% 40%; border: 2px solid var(--ink);
        background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 35%, #fff), var(--c) 55%); transform: scale(var(--s, 1)); transform-origin: 50% 80%; transition: transform 0.3s; }
      .rival .n { color: #f2e9ff; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .rival .k { font-weight: 800; font-size: 11px; color: #a995cc; white-space: nowrap; }
      .rival .s { grid-row: 1 / 3; text-align: right; font: 400 16px/1 'Lilita One', system-ui, sans-serif; color: var(--cream); }
      .rival .st { grid-column: 3 / 5; grid-row: 2; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.4); overflow: hidden; }
      .rival .st i { display: block; height: 100%; width: 100%; border-radius: 2px; transform-origin: 0 50%; transform: scaleX(var(--st, 1)); background: var(--c); }
      .rival.me { background: color-mix(in srgb, var(--c) 30%, var(--panel2)); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); margin: 3px -3px; padding-left: 6px; padding-right: 10px; }
      .rival.me .n { color: #fff; }
      .rival.out { opacity: 0.38; }
      .rival.out .blob { filter: grayscale(1); }
      .rival.isdazed .n::after { content: ' 💫'; }
      #popups { position: fixed; inset: 0; pointer-events: none; }
      .popup { position: absolute; left: 0; top: 0; will-change: transform, opacity; contain: layout style; font-family: 'Lilita One', system-ui, sans-serif; font-size: 24px; -webkit-text-stroke: 4px #12051f; paint-order: stroke fill; text-shadow: 0 2px 0 #000; white-space: nowrap; }
      .popup.big { font-size: 46px; -webkit-text-stroke: 6px #12051f; }
      #toast { position: fixed; top: 18px; left: 50%; transform: translate(-50%, -10px) rotate(-1.5deg); padding: 6px 18px 7px; border-radius: 14px; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 400 18px/1.1 'Lilita One', system-ui, sans-serif; letter-spacing: 0.5px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 30; }
      #toast.show { opacity: 1; transform: translate(-50%, 0) rotate(-1.5deg); }
      #app canvas { cursor: grab; }
      #app canvas:active { cursor: grabbing; }
      /* pantalla de carga (las animaciones son sólo transform/opacity: siguen moviéndose aunque el juego esté ocupado) */
      #loading { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(ellipse at 50% 45%, #3a1666, #0c0518 70%); opacity: 0; visibility: hidden; transition: opacity 0.35s, visibility 0s 0.35s; pointer-events: none; }
      #loading.show { opacity: 1; visibility: visible; transition: none; pointer-events: auto; }
      #loading .ld-title { font-size: 58px; min-height: 1.2em; }
      #loading .ld-blob { position: relative; width: 96px; height: 84px; transform-origin: 50% 100%; animation: ld-bounce 0.9s cubic-bezier(0.3, 0, 0.4, 1) infinite; }
      #loading .ld-blob i { position: absolute; inset: 0; border-radius: 50% 50% 44% 44% / 60% 60% 40% 40%; background: radial-gradient(circle at 34% 30%, #ffd1ea, #ff4fa3 45%, #a3125e); box-shadow: inset -8px -10px 18px rgba(80, 0, 40, 0.45), 0 0 30px rgba(255, 79, 163, 0.45); }
      #loading .ld-blob b { position: absolute; top: 34%; width: 10px; height: 14px; border-radius: 50%; background: #1a0820; }
      #loading .ld-blob b:first-of-type { left: 32%; } #loading .ld-blob b:last-of-type { right: 32%; }
      #loading .ld-shadow { width: 90px; height: 12px; margin-top: -14px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); animation: ld-shadow 0.9s cubic-bezier(0.3, 0, 0.4, 1) infinite; }
      #loading .ld-text { font-size: 18px; color: #d9c6f2; }
      @keyframes ld-bounce { 0%, 100% { transform: translateY(0) scale(1.18, 0.82); } 15% { transform: translateY(-6px) scale(0.92, 1.1); } 50% { transform: translateY(-46px) scale(0.96, 1.04); } 85% { transform: translateY(-4px) scale(1.04, 0.96); } }
      @keyframes ld-shadow { 0%, 100% { transform: scale(1.1); opacity: 0.9; } 50% { transform: scale(0.6); opacity: 0.35; } }

      /* ---------- pantalla de inicio (mismo estilo calcomanía que el HUD) ---------- */
      #lobby { --pc: #ff4fa3; position: fixed; inset: 0; z-index: 20; display: none; overflow-y: auto; padding: 28px 24px 24px; font-family: 'Nunito', system-ui, sans-serif;
        background: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1.5px, transparent 2px) 0 0 / 26px 26px, radial-gradient(ellipse at 50% 35%, #3a1868, #170828 75%); }
      #lobby.show { display: grid; }
      body.in-lobby #help, body.in-lobby #me, body.in-lobby #rivals, body.in-lobby .lil-gui { display: none !important; }
      .lb-wrap { margin: auto; display: grid; grid-template-columns: 400px minmax(300px, 560px); grid-template-rows: auto 1fr; column-gap: 34px; row-gap: 22px; align-items: start; width: min(100%, 1000px); }
      .lb-logo { grid-column: 1 / -1; justify-self: center; text-align: center; }
      .lb-logo h1 { margin: 0; font: 400 76px/0.95 'Lilita One', system-ui, sans-serif; letter-spacing: 4px; color: var(--pc); -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 var(--ink); transform: rotate(-2deg); }
      .lb-sub { display: inline-block; margin: 10px 0 0; padding: 4px 14px; border-radius: 10px; background: var(--gold); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font-weight: 900; font-size: 13px; transform: rotate(1.5deg); }
      .lb-panel { padding: 18px 20px 20px; border-radius: 24px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink); user-select: none; }
      .lb-h { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 7px; font: 400 17px/1 'Lilita One', system-ui, sans-serif; letter-spacing: 1px; color: var(--cream); }
      .lb-h:first-child { margin-top: 0; }
      .lb-hint { font: 800 11px/1 'Nunito', system-ui, sans-serif; letter-spacing: 0; color: #a995cc; }
      .lb-name, .lb-hex { width: 100%; padding: 8px 12px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); color: var(--ink); font: 400 20px/1.1 'Lilita One', system-ui, sans-serif; outline: none; box-shadow: inset 0 3px 0 rgba(0,0,0,0.12); }
      .lb-name:focus, .lb-hex:focus { box-shadow: inset 0 3px 0 rgba(0,0,0,0.12), 0 0 0 3px var(--pc); }
      /* botones: calcomanías que se hunden al apretar */
      .lb-panel button { padding: 7px 11px; border-radius: 12px; border: 3px solid var(--ink); background: var(--panel2); color: var(--cream); font: 800 13px/1.1 'Nunito', system-ui, sans-serif; cursor: pointer; box-shadow: 0 3px 0 var(--ink); transition: transform 0.06s, box-shadow 0.06s; }
      .lb-panel button:hover { background: #432570; }
      .lb-panel button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
      .lb-panel button.on { background: var(--pc); color: var(--ink); }
      /* forma */
      .lb-shapes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
      .lb-panel button.lb-shape { display: grid; justify-items: center; gap: 2px; padding: 5px 0 4px; font-size: 10.5px; font-weight: 900; }
      .lb-shape svg { width: 100%; max-width: 42px; aspect-ratio: 1; }
      .lb-shape path { fill: var(--pc); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
      .lb-shape circle { fill: var(--ink); }
      .lb-panel button.lb-shape.on { background: var(--cream); color: var(--ink); transform: translateY(-3px) rotate(-2deg); box-shadow: 0 5px 0 var(--ink); }
      /* color */
      .lb-sv, .lb-hue { position: relative; touch-action: none; cursor: crosshair; }
      .lb-sv canvas { display: block; width: 100%; height: 150px; border-radius: 14px; border: 3px solid var(--ink); }
      .lb-hue { margin-top: 10px; }
      .lb-hue canvas { display: block; width: 100%; height: 20px; border-radius: 10px; border: 3px solid var(--ink); }
      .lb-drop { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid var(--ink); box-shadow: 0 0 0 2px #fff, 0 4px 0 2px var(--ink); pointer-events: none; }
      .lb-hcur { position: absolute; top: -5px; width: 16px; height: 30px; margin-left: -8px; border-radius: 7px; border: 3px solid var(--ink); box-shadow: 0 0 0 2px #fff; pointer-events: none; }
      .lb-crow { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; margin-top: 12px; align-items: center; }
      .lb-sw { width: 44px; height: 40px; border-radius: 12px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
      .lb-hex { font: 800 16px/1.1 ui-monospace, monospace; text-transform: lowercase; padding: 8px 10px; }
      /* tatuaje */
      .lb-tat { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: start; }

      .lb-mblob { position: absolute; top: -40px; left: 50%; width: 84px; height: 72px; margin-left: -42px; transform-origin: 50% 100%; animation: ld-bounce 0.9s cubic-bezier(0.3, 0, 0.4, 1) infinite; }

      /* vista previa: marco de calcomanía con el nombre arriba, como en el juego */
      .lb-stage { display: grid; justify-items: center; align-content: start; padding-top: 18px; position: sticky; top: 0; }

      #touch .tc-oil { right: calc(112px + env(safe-area-inset-right)); bottom: calc(124px + env(safe-area-inset-bottom)); }
      #touch .tc-menu { position: absolute; left: 50%; top: calc(6px + env(safe-area-inset-top)); transform: translateX(-50%); pointer-events: auto; width: 46px; height: 36px; border-radius: 12px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); color: var(--cream); font: 900 20px/1 'Nunito', system-ui, sans-serif; }
      /* HUD más chico y arriba, para dejar libres los pulgares */

      /* el juego va acostado */

      .tu-card { position: relative; padding: 12px 16px 14px; border-radius: 20px; background: var(--panel); border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink); font: 700 14px/1.45 'Nunito', system-ui, sans-serif; color: #e9defa; transition: transform 0.15s; }

      #tm-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); }

      #tm-count { position: fixed; left: 50%; top: 42%; z-index: 27; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; font: 400 150px/1 'Lilita One', system-ui, sans-serif; color: #fff; -webkit-text-stroke: 16px var(--ink); paint-order: stroke fill; text-shadow: 0 12px 0 var(--ink); }
      #tm-count.show { animation: tm-pop 0.95s cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }

      .rival.human .n::before { content: '👤 '; font-size: 0.85em; }
      .rival.tA { box-shadow: inset 5px 0 0 #2f8bff; } .rival.tB { box-shadow: inset 5px 0 0 #ff3b4f; }

      .lb-mwide { width: min(560px, 100%); padding-top: 26px; }
      .lb-mcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 4px; }
      .lb-mbox .lb-mcard { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 12px 14px; background: var(--panel2); color: var(--cream); text-align: center; }

      .lb-mcard b { font: 400 22px/1.05 'Lilita One', system-ui, sans-serif; letter-spacing: 0.5px; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; color: #fff; }
      .lb-mcard small { font: 700 12.5px/1.4 'Nunito', system-ui, sans-serif; color: #cbb9ea; }
      .lb-mico { display: flex; gap: 4px; font-size: 38px; line-height: 1; height: 44px; align-items: center; }
      .lb-mico i { width: 34px; height: 30px; border-radius: 50% 50% 44% 44% / 60% 60% 40% 40%; border: 3px solid var(--ink); }
      .lb-mico i.tA { background: #2f8bff; } .lb-mico i.tB { background: #ff3b4f; }
      @media (max-width: 520px) { .lb-mcards { grid-template-columns: 1fr; } }
      body:not(.is-admin) .op-dev { display: none; } /* atajos de prueba: sólo en la página del admin */
      /* los mejores de la semana (y el botón al ranking completo) */
      .lb-recs { margin: 12px 0 0; padding: 10px 14px 10px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.12); }
      .lb-recs > b { display: block; font: 400 16px/1 'Lilita One', system-ui, sans-serif; letter-spacing: 0.5px; color: var(--gold); margin-bottom: 6px; }
      .lb-recs ol { margin: 0; padding: 0; list-style: none; font: 800 13px/1.75 'Nunito', system-ui, sans-serif; color: #e9defa; }
      .lb-recs li { display: flex; align-items: baseline; gap: 6px; }
      .lb-recs li i { font-style: normal; width: 22px; text-align: center; color: #a995cc; }
      .lb-recs li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .lb-rbox { width: min(620px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; padding: 22px 20px 16px; text-align: left; }

      .lb-rtabs { display: flex; justify-content: center; gap: 6px; margin: 6px 0 4px; }

      .lb-rtabs button.on { background: var(--gold); color: var(--ink); }

      .lb-rlist th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 900; font-size: 11.5px; letter-spacing: 0.6px; text-transform: uppercase; color: #a995cc; padding: 4px 6px 6px; }
      .lb-rlist td { padding: 6px; border-top: 1px solid rgba(255,255,255,0.07); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lb-rlist .n { text-align: right; font-variant-numeric: tabular-nums; }
      .lb-rlist td.k { width: 34px; text-align: center; color: #a995cc; }
      .lb-rlist td.b { font-family: 'Lilita One', system-ui, sans-serif; font-weight: 400; color: var(--cream); font-size: 15px; }
      .lb-rlist tr.mine td { background: rgba(255, 210, 26, 0.12); color: var(--gold); }
      .lb-rnone { text-align: center; color: #a995cc; margin: 30px 0; font: 800 14px/1.4 'Nunito', system-ui, sans-serif; }
      .lb-rbox .lb-rme { text-align: center; margin-top: 8px; }
      .lb-rnote { margin: 8px 0 0 !important; text-align: center; font-size: 12px !important; color: #8d7bb0 !important; }
      /* ---------- logo BOUNCY BLOBS (src/logo.js): letras de caramelo que rebotan en cadena; la O es un blob ---------- */
      .bb-logo { display: inline-flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 0 0.3em; font-family: 'Lilita One', 'Trebuchet MS', system-ui, sans-serif; font-weight: 400; font-style: normal; line-height: 1; letter-spacing: 0; transform: rotate(-2deg); }
      .bb-w { display: inline-flex; align-items: flex-end; }
      .bb-l { display: inline-block; position: relative; color: var(--c); -webkit-text-stroke: 0.13em var(--ink); paint-order: stroke fill; text-shadow: 0 0.085em 0 var(--ink); transform-origin: 50% 100%; transform: rotate(var(--r)); animation: bb-bounce 2.4s cubic-bezier(0.3, 0, 0.4, 1) infinite; animation-delay: calc(var(--i) * 0.09s); }
      @keyframes bb-bounce {
        0%, 50%, 100% { transform: translateY(0) rotate(var(--r)) scale(1, 1); }
        10% { transform: translateY(-0.22em) rotate(var(--r)) scale(0.9, 1.12); }
        22% { transform: translateY(0) rotate(var(--r)) scale(1.16, 0.84); }
        31% { transform: translateY(-0.05em) rotate(var(--r)) scale(0.95, 1.05); }
        40% { transform: translateY(0) rotate(var(--r)) scale(1.03, 0.97); }
      }
      .bb-o { width: 0.78em; height: 0.74em; margin: 0 -0.05em 0.03em 0.01em; border-radius: 50% 50% 44% 44% / 60% 60% 40% 40%; background: radial-gradient(circle at 34% 30%, #fff 0, var(--c) 42%, color-mix(in srgb, var(--c) 62%, #000)); border: 0.075em solid var(--ink); box-shadow: 0 0.085em 0 var(--ink); }
      .bb-o i { position: absolute; top: 30%; width: 0.11em; height: 0.17em; border-radius: 50%; background: var(--ink); animation: bb-blink 4s infinite; transform-origin: 50% 50%; }
      .bb-o i:first-child { left: 29%; } .bb-o i:last-child { right: 29%; }
      @keyframes bb-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      .lb-logo h1 .bb-logo { transform: rotate(-2deg); }
      /* los rebotes arrancan cuando la letra ya está (src/boot.js pone .fonts-ready): si no, se redibujaba al cambiar de fuente */
      html:not(.fonts-ready) .bb-l, html:not(.fonts-ready) .bb-o i { animation-play-state: paused; }
      @media (prefers-reduced-motion: reduce) { .bb-l, .bb-o i { animation: none; } }
    </style>
