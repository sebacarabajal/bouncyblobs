# Base de datos para desarrollo (la misma versión que en el VPS). Sólo escucha en esta PC.
#   docker compose -f compose.dev.yml up -d        → arrancar
#   docker compose -f compose.dev.yml down         → apagar (los datos quedan en el volumen)
# El servidor del juego la usa con DATABASE_URL=postgres://gelatinas:gelatinas_dev@127.0.0.1:5440/gelatinas
name: gelatinas_dev
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gelatinas
      POSTGRES_PASSWORD: gelatinas_dev
      POSTGRES_DB: gelatinas
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gelatinas -d gelatinas"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db:
