<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel · Bouncy Blobs</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      .viz-root {
        color-scheme: light;
        --page: #f3f2ef; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
        --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77756f;
        --series-1: #2a78d6; --series-2: #eb6834;
        --grid: #e8e6e1; --axis: #c3c2b7; --good: #0ca30c; --good-text: #006300; --bad-text: #b42f2f;
        --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
        --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab; --seq-5: #104281;
        --accent-wash: rgba(42, 120, 214, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) .viz-root {
          color-scheme: dark;
          --page: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
          --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
          --series-1: #3987e5; --series-2: #d95926; --grid: #2a2a27; --axis: #383835;
          --good-text: #0ca30c; --bad-text: #e66767;
          --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec;
          --accent-wash: rgba(57, 135, 229, 0.16);
        }
      }
      :root[data-theme="dark"] .viz-root {
        color-scheme: dark;
        --page: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
        --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
        --series-1: #3987e5; --series-2: #d95926; --grid: #2a2a27; --axis: #383835;
        --good-text: #0ca30c; --bad-text: #e66767;
        --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec;
        --accent-wash: rgba(57, 135, 229, 0.16);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body.viz-root { background: var(--page); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      a { color: inherit; }
      code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-secondary); }
      button, select, input { font: inherit; color: inherit; }

      /* encabezado: marca, páginas, quién está */
      .top { position: sticky; top: 0; z-index: 6; background: var(--surface-1); border-bottom: 1px solid var(--border); }
      .bar1 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: 1320px; margin: 0 auto; padding: 10px 16px 0; }
      .brand { margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; }
      .brand span { color: var(--text-muted); font-weight: 500; }
      nav#nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; order: 3; width: 100%; }
      nav#nav a { text-decoration: none; color: var(--text-secondary); padding: 9px 12px 10px; border-bottom: 2px solid transparent; white-space: nowrap; border-radius: 6px 6px 0 0; }
      nav#nav a:hover { color: var(--text-primary); background: var(--surface-2); }
      nav#nav a.on { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--series-1); }
      .grow { flex: 1; }
      .live { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 13px; white-space: nowrap; }
      .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
      .who { color: var(--text-muted); font-size: 12px; }
      a.play { color: var(--text-primary); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
      a.play:hover { background: var(--surface-2); }

      /* filtros: una sola fila arriba de todo lo que filtran */
      .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; max-width: 1320px; margin: 0 auto; padding: 14px 16px 0; }
      .filters[hidden] { display: none; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
      .seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 6px 11px; cursor: pointer; }
      .seg button + button { border-left: 1px solid var(--border); }
      .seg button:hover { background: var(--surface-2); }
      .seg button.on { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
      .fsel { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-muted); }
      .fsel select { max-width: 190px; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; background: var(--surface-1); color: var(--text-primary); font-size: 13px; cursor: pointer; }
      .fsel select.on { border-color: var(--series-1); background: var(--accent-wash); font-weight: 600; }
      .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
      .clear { border: 0; background: transparent; color: var(--series-1); cursor: pointer; padding: 6px 4px; font-size: 13px; }
      .clear:hover { text-decoration: underline; }

      /* contenido */
      main { max-width: 1320px; margin: 0 auto; padding: 16px 16px 60px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; transition: opacity 0.15s; }
      main.loading { opacity: 0.55; pointer-events: none; }
      .card { grid-column: span 12; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
      .c6 { grid-column: span 6; } .c4 { grid-column: span 4; } .c8 { grid-column: span 8; }
      @media (max-width: 1100px) { .c4 { grid-column: span 6; } }
      @media (max-width: 860px) { .c6, .c4, .c8 { grid-column: span 12; } }
      .card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
      .card .sub { margin: 0 0 12px; color: var(--text-muted); font-size: 12.5px; }
      .kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
      .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
      .kpi .l { color: var(--text-secondary); font-size: 12.5px; }
      .kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; margin: 2px 0; }
      .kpi .d { font-size: 12px; color: var(--text-muted); }
      .kpi .d b { font-weight: 600; color: var(--text-secondary); }
      .kpi .d.good b { color: var(--good-text); } .kpi .d.bad b { color: var(--bad-text); }
      .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px; color: var(--text-secondary); font-size: 12.5px; }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
      svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
      svg.chart text { fill: var(--text-muted); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
      svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
      svg.chart .axis { stroke: var(--axis); stroke-width: 1; }
      svg.chart .bar { transition: opacity 0.1s; }
      svg.chart .hit { fill: transparent; cursor: default; }
      svg.chart g.col:hover .bar, svg.chart g.col:focus .bar { opacity: 0.8; }
      svg.chart g.col:focus { outline: none; }
      .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); font-size: 12.5px; min-width: 120px; display: none; }
      .tip .t { color: var(--text-muted); margin-bottom: 4px; }
      .tip .r { display: flex; align-items: center; gap: 8px; }
      .tip .r i { width: 12px; height: 2px; border-radius: 1px; }
      .tip .r b { font-variant-numeric: tabular-nums; }
      .tip .r span { color: var(--text-secondary); }
      .hb { display: grid; grid-template-columns: minmax(90px, 40%) 1fr auto; align-items: center; gap: 5px 10px; font-size: 13px; }
      .hb .k { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hb .k.pick { cursor: pointer; }
      .hb .k.pick:hover, .hb .k.pick:focus { color: var(--text-primary); text-decoration: underline; outline: none; }
      .hb .track { height: 14px; position: relative; }
      .hb .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
      .hb .n { font-variant-numeric: tabular-nums; color: var(--text-primary); text-align: right; min-width: 44px; white-space: nowrap; }
      .hb .n small { color: var(--text-muted); margin-left: 6px; }
      .hero { display: flex; gap: 12px; flex-wrap: wrap; }
      .hero > div { flex: 1; min-width: 110px; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
      .hero .v { font-size: 28px; font-weight: 700; }
      .hero .l { color: var(--text-secondary); font-size: 12.5px; }
      .hero .s { color: var(--text-muted); font-size: 11.5px; }
      .scroll { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); padding: 7px 8px; white-space: nowrap; }
      td { border-bottom: 1px solid var(--grid); padding: 7px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
      td.num, th.num { text-align: right; }
      tr.link { cursor: pointer; }
      tr.link:hover td, tr.link:focus td { background: var(--surface-2); }
      tr.link:focus { outline: none; }
      td small, .who2 small { color: var(--text-muted); }
      td .gpu { border-bottom: 1px dotted var(--text-muted); }
      details { margin-top: 10px; }
      summary { cursor: pointer; color: var(--text-muted); font-size: 12.5px; }
      .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
      .err { grid-column: span 12; padding: 30px; text-align: center; color: var(--text-secondary); }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
      .toolbar input[type=search] { flex: 1 1 260px; max-width: 420px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; background: var(--surface-1); }
      .toolbar input[type=search]:focus, .fsel select:focus { outline: 2px solid var(--accent-wash); border-color: var(--series-1); }
      .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--text-muted); font-size: 12.5px; }
      .pager button { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; background: var(--surface-1); cursor: pointer; }
      .pager button:hover:not(:disabled) { background: var(--surface-2); }
      .pager button:disabled { opacity: 0.45; cursor: default; }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 12px; margin-left: 4px; white-space: nowrap; }
      .badge.warn { background: rgba(250, 178, 25, 0.18); color: var(--text-primary); }
      .badge.live::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; }
      .phead .back { display: inline-block; color: var(--text-muted); text-decoration: none; font-size: 13px; margin-bottom: 6px; }
      .phead .back:hover { color: var(--text-primary); }
      .ptitle { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
      .ptitle h1 { margin: 0 8px 0 0; font-size: 24px; }
      .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 18px; margin: 0; }
      .facts dt { color: var(--text-muted); font-size: 12px; }
      .facts dd { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
      .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
      .room { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
      .room .rtop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .room .rtop b { font-size: 15px; }
      .room .meta { color: var(--text-secondary); font-size: 12.5px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
      .room .rbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); margin-bottom: 8px; }
      .room .rbar i { display: block; height: 100%; }
      .room ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; color: var(--text-primary); }
      .room ul li span { color: var(--text-muted); }
      .room button { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 7px; background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
      .room button:hover:not(:disabled) { background: var(--page); }
      .room button:disabled { opacity: 0.5; cursor: default; }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-1); color: var(--text-secondary); font-size: 12px; }
      @media (min-width: 1000px) { nav#nav { order: 0; width: auto; } }
    </style>
  </head>
  <body class="viz-root">
    <header class="top">
      <div class="bar1">
        <h1 class="brand">🫧 Bouncy Blobs <span>· Panel</span></h1>
        <nav id="nav" aria-label="Páginas"></nav>
        <span class="grow"></span>
        <span class="live" id="live">—</span>
        <span class="who" id="who"></span>
        <a class="play" id="play" href="/juego">🎮 Jugar como admin</a>
      </div>
    </header>
    <div class="filters" id="filters" role="toolbar" aria-label="Filtros"></div>
    <main id="app"><div class="err">Cargando…</div></main>
    <div class="tip" id="tip" role="status"></div>
    <script type="module" src="/src/admin/admin.js"></script>
  </body>
</html>
