<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Bouncy Blobs · Analíticas</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      .viz-root {
        color-scheme: light;
        --page: #f3f2ef; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e0da;
        --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77756f;
        --series-1: #2a78d6; --series-2: #eb6834;
        --grid: #e8e6e1; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
        --seq-1: #86b6ef; --seq-2: #5598e7; --seq-3: #2a78d6; --seq-4: #1c5cab; --seq-5: #104281;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) .viz-root {
          color-scheme: dark;
          --page: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
          --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
          --series-1: #3987e5; --series-2: #d95926; --grid: #2a2a27;
          --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec;
        }
      }
      :root[data-theme="dark"] .viz-root {
        color-scheme: dark;
        --page: #121211; --surface-1: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
        --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
        --series-1: #3987e5; --series-2: #d95926; --grid: #2a2a27;
        --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #6da7ec;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body.viz-root { background: var(--page); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
      header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
      header h1 span { color: var(--text-muted); font-weight: 500; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 6px 12px; font: inherit; cursor: pointer; }
      .seg button + button { border-left: 1px solid var(--border); }
      .seg button.on { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
      .live { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 13px; }
      .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
      .grow { flex: 1; }
      .who { color: var(--text-muted); font-size: 12px; }
      a.play { color: var(--text-primary); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
      a.play:hover { background: var(--surface-2); }
      main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
      .card { grid-column: span 12; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
      .c6 { grid-column: span 6; } .c4 { grid-column: span 4; } .c8 { grid-column: span 8; }
      @media (max-width: 900px) { .c6, .c4, .c8 { grid-column: span 12; } }
      .card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 650; }
      .card .sub { margin: 0 0 12px; color: var(--text-muted); font-size: 12.5px; }
      .kpis { grid-column: span 12; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
      .kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
      .kpi .l { color: var(--text-secondary); font-size: 12.5px; }
      .kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0; font-variant-numeric: tabular-nums; }
      .kpi .d { font-size: 12px; color: var(--text-muted); }
      .kpi .d b { font-weight: 600; color: var(--text-secondary); }
      .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px; color: var(--text-secondary); font-size: 12.5px; }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
      svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
      svg.chart text { fill: var(--text-muted); font-size: 11px; font-family: inherit; }
      svg.chart .grid { stroke: var(--grid); stroke-width: 1; }
      svg.chart .bar { transition: opacity 0.1s; }
      svg.chart .hit { fill: transparent; cursor: default; }
      svg.chart g.col:hover .bar, svg.chart g.col:focus .bar { opacity: 0.8; }
      svg.chart g.col:focus { outline: none; }
      .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); font-size: 12.5px; min-width: 120px; display: none; }
      .tip .t { color: var(--text-muted); margin-bottom: 4px; }
      .tip .r { display: flex; align-items: center; gap: 8px; }
      .tip .r i { width: 12px; height: 2px; border-radius: 1px; }
      .tip .r b { font-variant-numeric: tabular-nums; }
      .tip .r span { color: var(--text-secondary); }
      .hb { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; align-items: center; gap: 4px 10px; font-size: 13px; }
      .hb .k { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hb .track { height: 14px; border-radius: 0 4px 4px 0; position: relative; }
      .hb .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 2px; }
      .hb .n { font-variant-numeric: tabular-nums; color: var(--text-primary); text-align: right; min-width: 44px; }
      .hb .n small { color: var(--text-muted); margin-left: 4px; }
      .hero { display: flex; gap: 12px; flex-wrap: wrap; }
      .hero > div { flex: 1; min-width: 110px; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; }
      .hero .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .hero .l { color: var(--text-secondary); font-size: 12.5px; }
      .hero .s { color: var(--text-muted); font-size: 11.5px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); padding: 6px 8px; }
      td { border-bottom: 1px solid var(--grid); padding: 6px 8px; font-variant-numeric: tabular-nums; }
      td.num, th.num { text-align: right; }
      details { margin-top: 8px; }
      summary { cursor: pointer; color: var(--text-muted); font-size: 12.5px; }
      .status { display: inline-flex; align-items: center; gap: 6px; }
      .empty { color: var(--text-muted); font-size: 13px; padding: 12px 0; }
      .err { grid-column: span 12; padding: 30px; text-align: center; color: var(--text-secondary); }
      .roomsWrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 0; }
      .rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
      .room { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
      .room .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .room .top b { font-size: 15px; }
      .room .meta { color: var(--text-secondary); font-size: 12.5px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
      .room .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); margin-bottom: 8px; }
      .room .bar i { display: block; height: 100%; }
      .room ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; color: var(--text-primary); }
      .room ul li span { color: var(--text-muted); }
      .room button { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 7px; background: var(--surface-1); color: var(--text-primary); font: inherit; cursor: pointer; }
      .room button:hover:not(:disabled) { background: var(--page); }
      .room button:disabled { opacity: 0.5; cursor: default; }
      .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-secondary); font-size: 12px; }
    </style>
  </head>
  <body class="viz-root">
    <header>
      <h1>🫧 Bouncy Blobs <span>· Analíticas</span></h1>
      <div class="seg" id="range"><button data-d="1">Hoy</button><button data-d="7">7 días</button><button data-d="30" class="on">30 días</button><button data-d="90">90 días</button></div>
      <span class="live" id="live">—</span>
      <span class="grow"></span>
      <span class="who" id="who"></span>
      <a class="play" id="play" href="/juego">🎮 Jugar como admin</a>
    </header>
    <div class="roomsWrap"><section class="card" id="rooms"><h2>Salas en tiempo real</h2><p class="sub">Se actualiza cada 2 segundos. Al entrar a jugar ocupas el lugar de un bot (sólo si la sala tiene lugar).</p><div id="roomsBody"><div class="empty">Cargando…</div></div></section></div>
    <main id="app"><div class="err">Cargando…</div></main>
    <div class="tip" id="tip" role="status"></div>
    <script type="module" src="/src/admin/admin.js"></script>
  </body>
</html>
